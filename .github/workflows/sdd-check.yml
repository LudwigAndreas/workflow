# "story followed SDD" metric check.
#
# This file is a template for the application repos (frontend, backend,
# common, gitops_*, nginx) - copy it into each repo as-is. It also runs in
# this workflow repo against the shared specifications store.
#
# Optional: set JIRA_URL as a repo variable and JIRA_TOKEN as a secret to
# additionally assert that the linked story is a Story carrying the SDD
# label. Without them, every git-side check still runs.

name: SDD check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the spec-before-code check needs the merge-base
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec

      - name: Check the SDD metric
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          # on a PR, the branch under test is the head ref, not the merge ref
          SDD_BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
        run: ./scripts/check-sdd.sh
