# Release on merge — gate 7.
#
# TEMPLATE for the application repos (backend, frontend, common, nginx).
# Copy it in as-is and set the `SERVICE` env below. It does not run usefully
# in this workflow repo, which builds no images.
#
# On every push to main it: computes the next version from conventional
# commits, tags, builds and pushes an image by digest, generates release
# notes, stamps Jira Fix Versions, and asks the GitOps repo to roll dev.
#
# Nobody types a version number. See docs/release.md.
#
# Required repo configuration
#   vars.JIRA_URL              https://acme.atlassian.net
#   vars.JIRA_PROJECT          PROJ
#   vars.JIRA_EMAIL            set on Jira Cloud, leave unset on Server/DC
#   vars.GITOPS_REPO           your-org/gitops_backend
#   vars.WORKFLOW_REPO         your-org/workflow  (source of the scripts)
#   secrets.JIRA_TOKEN         API token / PAT
#   secrets.GITOPS_TOKEN       PAT with `repo` scope on the GitOps repo

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  SERVICE: backend # <-- set this per repo
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version computation needs every tag

      - name: Fetch the shared release scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WORKFLOW_REPO }}
          path: .workflow
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Compute the next version
        id: version
        run: |
          out="$(.workflow/scripts/release-version.sh --service "$SERVICE" --json)"
          echo "$out"
          {
            echo "release=$(jq -r .release <<<"$out")"
            echo "version=$(jq -r .next <<<"$out")"
            echo "tag=$(jq -r .tag <<<"$out")"
            echo "range=$(jq -r .range <<<"$out")"
            echo "keys=$(jq -r '.keys | join(" ")' <<<"$out")"
          } >> "$GITHUB_OUTPUT"

      # Every step below is skipped when nothing releasable landed.
      - name: Guard — a hotfix tag must be an ancestor of main
        if: steps.version.outputs.release == 'true'
        run: |
          # A hotfix branches from a production tag. If it was never
          # forward-ported, releasing from main would silently revert it.
          missing=0
          for tag in $(git tag --list "${SERVICE}-*"); do
            if ! git merge-base --is-ancestor "$tag" HEAD; then
              echo "::error::$tag is not an ancestor of main - forward-port the hotfix before releasing"
              missing=1
            fi
          done
          exit $missing

      - name: Build, test and push
        id: build
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.SERVICE }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.SERVICE }}:${{ steps.version.outputs.version }}-${{ github.sha }}
          provenance: true
          sbom: true

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name  "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          .workflow/scripts/release-version.sh --service "$SERVICE" --tag
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish release notes
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .workflow/scripts/release-version.sh --service "$SERVICE" --notes > notes.md
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${SERVICE} ${{ steps.version.outputs.version }}" \
            --notes-file notes.md

      - name: Stamp Jira Fix Versions
        if: steps.version.outputs.release == 'true'
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          .workflow/scripts/jira-release.sh \
            --service "$SERVICE" \
            --version "${{ steps.version.outputs.version }}" \
            --keys "${{ steps.version.outputs.keys }}"

      - name: Ask GitOps to roll dev
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          gh api "repos/${{ vars.GITOPS_REPO }}/dispatches" \
            -f event_type=deploy \
            -F "client_payload[service]=$SERVICE" \
            -F "client_payload[version]=${{ steps.version.outputs.version }}" \
            -F "client_payload[digest]=${{ steps.build.outputs.digest }}" \
            -F "client_payload[env]=dev" \
            -F "client_payload[keys]=${{ steps.version.outputs.keys }}"
